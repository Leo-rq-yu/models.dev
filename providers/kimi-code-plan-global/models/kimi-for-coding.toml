# Verified 2026-09-18 against https://api.kimi.ai/coding/v1/chat/completions
# with kimi-code OAuth credentials; reasoning returned via reasoning_content.
# Toggle: thinking.type = "enabled" | "disabled" | "adaptive"
# Effort: output_config.effort = "low" | "high" | "max" (default: "max")
schema = 2
base_model = "moonshotai/kimi-k2.8-preview"
name = "kimi-for-coding"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }

[limit]
output = 32_768

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0
cache = { read = 0, write = 0 }

[cost.text.output]
price = 0
