# API: Kimi K3 always thinks; thinking.type is not supported.
# Effort: reasoning_effort = "low" | "high" | "max" (default "max").
# https://platform.kimi.ai/docs/api/models-overview
# Pricing: https://platform.kimi.ai/docs/pricing/chat-k3 (accessed 2026-07-17).
# Cache write (same page, accessed 2026-10-07): $3.00 for the default 5min TTL,
# $6.00 for the 1h TTL; cache_write uses the default 5min price.
# Chat API max_completion_tokens can be set up to 1048576 for Kimi K3:
# https://platform.kimi.ai/docs/api/chat
schema = 2
base_model = "moonshotai/kimi-k3"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 1_048_576

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 3
cache = { read = 0.3, write = 3 }

[cost.text.output]
price = 15
