# Toggle: thinking.type = enabled|disabled on /chat/completions.
# Effort: reasoning_effort = low|high|max; default high.
# Anthropic: output_config.effort = low|high|max; budget ignored.
# The 2026-08-13 V4-Pro GA announcement explicitly introduces all three levels;
# the pricing page maps API model deepseek-v4-pro to DeepSeek-V4-Pro-0813.
# Pricing (off-peak, USD per 1M tokens): cache miss $0.66, cache hit $0.022, output $1.98; peak is 2x.
# Peak 01:00-04:00 and 06:00-10:00 UTC Mon-Fri excl. Chinese holidays; models.dev records off-peak like deepseek-flash.
# https://api-docs.deepseek.com/news/news260813/ (accessed 2026-09-20)
# https://api-docs.deepseek.com/guides/thinking_mode/ (accessed 2026-09-20)
# https://api-docs.deepseek.com/quick_start/pricing (accessed 2026-10-02)
# Chat API max_tokens: 1..393216 (384K): https://api-docs.deepseek.com/api/create-chat-completion/
# Reasoning tokens are billed at the output rate (no separate CoT price).
# `completion_tokens_details.reasoning_tokens` is a subset of completion_tokens.
# https://api-docs.deepseek.com/quick_start/pricing/ (accessed 2026-08-12)
schema = 2
base_model = "deepseek/deepseek-v4-pro-0813"
name = "DeepSeek V4 Pro"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.66
cache = { read = 0.022 }

[cost.text.output]
price = 1.98
reasoning = 1.98
