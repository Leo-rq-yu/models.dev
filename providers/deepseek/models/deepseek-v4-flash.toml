# October 17 upgrade: https://api-docs.deepseek.com/updates/
# Legacy alias. The DeepSeek-V4-Flash model is retired; requests to
# `deepseek-v4-flash` are still accepted but served by DeepSeek-V4.1-Flash-1017 and
# billed at the Flash price.
# Toggle: thinking.type = enabled|disabled
# Effort: reasoning_effort = low|high|max
# https://api-docs.deepseek.com/quick_start/pricing (accessed 2026-10-17)
# Served by deepseek-flash; Chat API max_tokens <= 393216:
# https://api-docs.deepseek.com/api/create-chat-completion/
schema = 2
base_model = "deepseek/deepseek-v4.1-flash-1017"
name = "DeepSeek V4 Flash"
status = "deprecated"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "high", "max"] }
structured_output = true

[limit]
output = 393_216

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15
cache = { read = 0.003 }

[cost.text.output]
price = 0.6
reasoning = 0.6
